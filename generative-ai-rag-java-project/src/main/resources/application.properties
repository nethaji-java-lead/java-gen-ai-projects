spring.application.name=spring-ai-rag-tutorial
server.port = 8081

spring.datasource.url=jdbc:postgresql://localhost:5433/vectordb
spring.datasource.username=postgres
spring.datasource.password=postgres

logging.level.org.springframework.ai.vectorstore=DEBUG

# Spring AI PGVector
spring.ai.vectorstore.pgvector.initialize-schema=true

spring.servlet.multipart.max-file-size=200GB
spring.servlet.multipart.max-request-size=200GB