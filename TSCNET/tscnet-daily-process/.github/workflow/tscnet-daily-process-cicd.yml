name: CI/CD Pipeline - TSCNET Daily Process

on:
  push:
    branches:
      - main
      - release/*
    paths:
      - 'TSCNET/tscnet-daily-process/**'
      - '.github/workflows/tscnet-daily-process-cicd.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'TSCNET/tscnet-daily-process/**'

env:
  WORKING_DIR: 'TSCNET/tscnet-daily-process'
  JAVA_VERSION: '21' # Updated to Java 21 to match eclipse-temurin:21-jre
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/tscnet-daily-process

jobs:
  # ================================
  # 1. BUILD & TEST STAGE
  # ================================
  build-and-test:
    name: Build JAR & Run Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: TSCNET/tscnet-daily-process

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache Maven Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # Builds target/daily-process-0.0.1-SNAPSHOT.jar required by your Dockerfile
      - name: Build JAR Package
        run: mvn clean package --batch-mode

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: built-jar
          path: TSCNET/tscnet-daily-process/target/daily-process-0.0.1-SNAPSHOT.jar

  # ================================
  # 2. DOCKER BUILD & PUSH STAGE
  # ================================
  docker-build-push:
    name: Build & Push Docker Image
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Built JAR
        uses: actions/download-artifact@v4
        with:
          name: built-jar
          path: TSCNET/tscnet-daily-process/target/

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./TSCNET/tscnet-daily-process
          file: ./TSCNET/tscnet-daily-process/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}