<!doctype html><html><head><meta charset="utf-8"><title>TSCNET Daily Process</title><style>body{font-family:Arial;margin:32px}button{padding:8px 14px}.card{border:1px solid #ddd;border-radius:8px;padding:16px;margin:12px 0}table{border-collapse:collapse;width:100%}th,td{border:1px solid #ddd;padding:8px;text-align:left}</style></head><body><h1>Daily Process Operations</h1><button onclick="trigger()">Manual initiation</button><button onclick="load()">Refresh history</button><div id="current" class="card">Loading…</div><h2>Historical executions</h2><table><thead><tr><th>Date</th><th>Type</th><th>Status</th><th>Total</th><th>Success</th><th>Failed</th><th>Triggered by</th></tr></thead><tbody id="rows"></tbody></table><script>async function load(){const r=await fetch('/api/process/history');const a=await r.json();rows.innerHTML=a.map(x=>`<tr><td>${x.businessDate}</td><td>${x.initiationType}</td><td>${x.status}</td><td>${x.totalFilesCount}</td><td>${x.processedFilesCount}</td><td>${x.failedFilesCount}</td><td>${x.triggeredBy}</td></tr>`).join(''); if(a[0]) current.innerHTML=`<b>Latest:</b> ${a[0].businessDate} — ${a[0].status} — ${a[0].processedFilesCount}/${a[0].totalFilesCount} files successful`; else current.textContent='No executions yet.';} async function trigger(){const r=await fetch('/api/process/trigger',{method:'POST'}); const x=await r.json(); alert(`Manual execution: ${x.status}`); load();} load();</script></body></html>
