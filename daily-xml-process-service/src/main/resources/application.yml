spring:
  datasource:
    url: jdbc:h2:mem:tscnet;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
process:
  scheduler:
    cron: "0 1 0 * * *"
    zone: "Europe/Berlin"
