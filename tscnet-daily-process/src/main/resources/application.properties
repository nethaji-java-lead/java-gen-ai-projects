spring.application.name=tscnet-daily-process
server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5433/tscnet_daily_process
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Production requirement: 00:01 every day.
# 0 * * * * * (every minute).
app.scheduler.cron=0 1 0 * * *
app.scheduler.enabled=true

# Europe/Munich is used as the process timezone assumption.
app.scheduler.zone=Europe/Munich

app.simulate.failure=false

sftp.host=localhost
sftp.port=2222
sftp.user=testuser
sftp.password=testpass

